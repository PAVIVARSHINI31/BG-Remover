<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Image Comparison</title>

<style>
*{
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}
.container{
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
}
.img-box{
    width: 65%;
    max-width: 900px;
    position: relative;
    overflow: hidden;
    line-height: 0;

    border-radius: 20px;
    background: rgba(255,255,255,0.1);
    backdrop-filter: blur(10px);
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
}
.img-box img{
    width: 100%;
    display: block;
    border-radius: 20px;
}
.img-wrap{
    position: absolute;
    top: 0;
    left: 0;
    width: 50px;
    overflow: hidden;
}
#line{
    width: 3px;
    height: 100%;
    background: white;
    position: absolute;
    top: 0;
    left: 50px;
    cursor: ew-resize;
}

.arrow{
    width: 40px;
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
}
body{
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;

    background: linear-gradient(-45deg, #1e3c72, #2a5298, #a73548, #dd2476);
    background-size: 400% 400%;
    animation: gradientMove 8s ease infinite;
}

@keyframes gradientMove{
    0%{ background-position: 0% 50%; }
    50%{ background-position: 100% 50%; }
    100%{ background-position: 0% 50%; }
}
</style>

</head>
<body>

<div class="container">
    <div class="img-box" id="imgBox">
        <img src="carimg/car.png">
        <div class="img-wrap" id="imgWrap">
            <img src="carimg/orgcar.jpg" id="carImg">
        </div>
        <div id="line">
            <img src="carimg/arrow.png" class="arrow">
        </div>

    </div>
</div>

<script>
let imgBox = document.getElementById("imgBox");
let imgWrap = document.getElementById("imgWrap");
let line = document.getElementById("line");
let carImg = document.getElementById("carImg");

carImg.style.width = imgBox.offsetWidth + "px";

let leftSpace = imgBox.getBoundingClientRect().left + window.scrollX;
imgBox.addEventListener("mousemove", function(e){
    let x = e.pageX - leftSpace;

    if(x < 0) x = 0;
    if(x > imgBox.offsetWidth) x = imgBox.offsetWidth;

    imgWrap.style.width = x + "px";
    line.style.left = x + "px";
});
imgBox.addEventListener("touchmove", function(e){
    let touch = e.touches[0];
    let x = touch.pageX - leftSpace;

    if(x < 0) x = 0;
    if(x > imgBox.offsetWidth) x = imgBox.offsetWidth;

    imgWrap.style.width = x + "px";
    line.style.left = x + "px";
});
</script>

</body>
</html>
